openapi: 3.0.3
info:
  title: AI Helpdesk Platform API
  description: >
    Multi-tenant support/helpdesk platform with role-based access control
    and AI-assisted ticket triage, reply suggestions, and summarization.

    Versioning: URL path versioning (/v1). Breaking changes ship as /v2
    with /v1 kept running until clients migrate — no header-based or
    content-negotiation versioning in this API.
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: https://api.yourapp.com/v1
    description: Production
  - url: http://localhost:4000/v1
    description: Local development

tags:
  - name: Auth
  - name: Organizations
  - name: Users
  - name: Tickets
  - name: Comments
  - name: AI
  - name: Analytics
  - name: Notifications

paths:
  # ---------- AUTH ----------
  # Authentication itself is delegated to Microsoft Entra ID External ID.
  # The frontend (MSAL / NextAuth with the Entra ID provider) handles the
  # actual sign-in redirect and receives an ID/access token directly from
  # Entra ID — this API never sees or stores a password. These endpoints
  # only cover what the API itself is responsible for: turning a validated
  # Entra ID token into an application user record with org/role context.
  /auth/session:
    post:
      tags: [Auth]
      summary: >
        Exchange a validated Entra ID token for an application session.
        Org resolution order for the staff flow:
        (1) organizationSubdomain in the request body, if the frontend is on a
        company-specific URL — resolved directly.
        (2) otherwise, the email domain is matched against verified
        OrganizationDomain records.
        (3) if a domain match is found: a pending Invite for this email
        wins and grants the invited role immediately; with no invite, the
        user is created with status PENDING_APPROVAL and role null, and
        an existing Admin/Owner must approve them via
        POST /users/{userId}/approve.
        (4) no subdomain, no domain match, no invite — bootstrap case: a new
        organization is created, this user becomes Owner, and their email
        domain is registered as that org's first (unverified) domain.

        The customer flow is separate and unaffected: organizationSubdomain is
        always required and the user is created directly as CUSTOMER with
        status ACTIVE — no domain matching or approval step applies to
        customers.
      security:
        - entraBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationSubdomain:
                  type: string
                  description: >
                    Present when the frontend is on a company-specific or
                    support-portal URL. Required for the customer flow;
                    optional for staff (falls back to domain matching).
      responses:
        '200':
          description: Existing user synced, application session returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '201':
          description: New user provisioned (ACTIVE, PENDING_APPROVAL, or new-org Owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Customer self-signup with no organizationSubdomain provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Entra ID token missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current application user (org, role) for the authenticated Entra ID identity
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
        '404':
          description: Entra ID identity has no application user yet — call /auth/session first

  # ---------- ORGANIZATIONS ----------
  /organizations/me:
    get:
      tags: [Organizations]
      summary: Get current user's organization
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

    patch:
      tags: [Organizations]
      summary: Update organization settings (Owner/Admin only)
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                supportEmail:
                  type: string
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Insufficient permissions

  /organizations/by-subdomain/{subdomain}:
    get:
      tags: [Organizations]
      summary: >
        Public lookup of an organization by subdomain — used by the customer
        support portal to show org branding/name before sign-up, and to
        validate the subdomain that will be passed to /auth/session.
      parameters:
        - name: subdomain
          in: path
          required: true
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Organization found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  subdomain:
                    type: string
        '404':
          description: No organization with that subdomain

  /organizations/branding:
    get:
      tags: [Organizations]
      summary: Get the current organization's branding (logo, colors, fetch status)
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: Current branding, or DEFAULT source/status if nothing resolved yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBranding'

    patch:
      tags: [Organizations]
      summary: >
        Manually set or override branding (Owner/Admin only). Any field
        set here marks source as CUSTOM and brandingStatus as FETCHED,
        and that field is excluded from future auto-refresh.
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logoUrl:
                  type: string
                  description: URL of a logo already uploaded via a separate file-upload endpoint
                primaryColor:
                  type: string
                accentColor:
                  type: string
      responses:
        '200':
          description: Updated branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBranding'
        '403':
          description: Insufficient permissions

  /organizations/branding/refresh:
    post:
      tags: [Organizations]
      summary: >
        Re-trigger the Brandfetch fetch job for this org's verified
        domain (Owner/Admin only). Sets brandingStatus to PENDING
        immediately; the actual result arrives asynchronously (poll
        GET /organizations/branding or listen for the corresponding
        WebSocket event). Only affects fields not already marked CUSTOM.
      security:
        - entraBearerAuth: []
      responses:
        '202':
          description: Refresh job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBranding'
        '403':
          description: Insufficient permissions
        '409':
          description: No verified domain to fetch branding from

  /organizations/domains:
    get:
      tags: [Organizations]
      summary: List domains claimed by the current organization (Owner/Admin only)
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: List of claimed domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDomain'

    post:
      tags: [Organizations]
      summary: >
        Claim a domain for domain-based staff auto-matching (Owner only).
        Returns a DNS TXT record value that must be published before the
        domain is used in auth resolution.
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  example: acme.com
              required: [domain]
      responses:
        '201':
          description: Domain claimed, pending DNS verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '403':
          description: Insufficient permissions
        '409':
          description: Domain already claimed by another organization

  /organizations/domains/{domainId}/verify:
    post:
      tags: [Organizations]
      summary: >
        Re-check the DNS TXT record and mark the domain verified if
        found (Owner only). On successful verification, this also queues
        an async branding-fetch job (see POST /organizations/branding/refresh)
        against the newly verified domain — the response here does not
        wait for that job to complete.
      security:
        - entraBearerAuth: []
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '403':
          description: Insufficient permissions
        '404':
          description: Domain not found

  /organizations/domains/{domainId}/enable-hosting:
    post:
      tags: [Organizations]
      summary: >
        Request custom-domain hosting on an already-verified domain
        (Owner only) — this is the core white-label capability, letting
        the org serve their portal at their own domain (e.g. support.acme.com)
        instead of a yourapp.com subdomain. Requires the domain to already
        have AUTH_MATCHING verification; this endpoint adds CUSTOM_HOSTING
        to purposes and returns CNAME instructions.
      security:
        - entraBearerAuth: []
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: >
            Hosting requested, hostingStatus set to PENDING_CNAME. Response
            includes the CNAME target the Owner must point their domain at.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationDomain'
                  - type: object
                    properties:
                      cnameTarget:
                        type: string
                        example: tenants.yourapp.com
        '403':
          description: Insufficient permissions
        '404':
          description: Domain not found
        '409':
          description: Domain is not yet verified for AUTH_MATCHING, or hosting already active

  /organizations/domains/{domainId}/hosting-status:
    get:
      tags: [Organizations]
      summary: >
        Poll the current CNAME/certificate provisioning status for a
        domain with hosting requested. Intended for a settings page to
        show live progress (PENDING_CNAME → PENDING_CERT → ACTIVE).
      security:
        - entraBearerAuth: []
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current hosting status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '404':
          description: Domain not found

  /organizations/invites:
    get:
      tags: [Organizations]
      summary: List invites for the current organization (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
      responses:
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'

    post:
      tags: [Organizations]
      summary: >
        Invite a teammate by email (Owner/Admin only). Creates a pending
        invite record; the invited role is applied automatically when that
        email signs in via Entra ID and hits POST /auth/session for the
        first time.
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/Role'
              required: [email, role]
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '403':
          description: Insufficient permissions
        '409':
          description: A pending invite already exists for this email in this organization

  /organizations/invites/{inviteId}:
    delete:
      tags: [Organizations]
      summary: Revoke a pending invite (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invite revoked
        '403':
          description: Insufficient permissions
        '404':
          description: Invite not found
        '409':
          description: Invite already accepted, cannot revoke

  # ---------- USERS ----------
  /users:
    get:
      tags: [Users]
      summary: List users in the current organization (Admin/Owner only)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          description: Filter by user status
          schema:
            type: string
            enum: [ACTIVE, PENDING_APPROVAL, DEACTIVATED]
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a user by ID
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    patch:
      tags: [Users]
      summary: >
        Update an ACTIVE user's role (Admin/Owner only). Not valid for
        PENDING_APPROVAL users — use POST /users/{userId}/approve instead,
        which is a distinct action requiring its own permission check.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
              required: [role]
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
        '409':
          description: User is not ACTIVE (e.g. still PENDING_APPROVAL or DEACTIVATED)

    delete:
      tags: [Users]
      summary: >
        Soft-remove a user from the organization (Owner only). Sets
        status to DEACTIVATED rather than deleting the row — this
        preserves referential integrity for tickets/comments the user
        created or was assigned, and revokes their access without
        losing history.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions

  /users/{userId}/approve:
    post:
      tags: [Users]
      summary: >
        Approve a PENDING_APPROVAL user (domain-matched but not yet
        granted a role) and assign their role, flipping status to
        ACTIVE. Owner/Admin only. This is the domain-matching
        counterpart to the invite flow, where role assignment happens
        immediately on sign-in instead.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
              required: [role]
      responses:
        '200':
          description: User approved and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
        '409':
          description: User is not in PENDING_APPROVAL status

  # ---------- TICKETS ----------
  /tickets:
    get:
      tags: [Tickets]
      summary: >
        List tickets, scoped by the authenticated user's org and role —
        customers see own tickets only, agents see assigned/team tickets,
        admins/owners see all tickets in their org. Organization is
        always derived from the validated Entra ID token's org context
        (see /auth/me), never from a client-supplied parameter — there
        is no organizationId query param, by design, since accepting one
        from the client would allow a request to specify an arbitrary
        org and break tenant isolation.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: assignedTo
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'

    post:
      tags: [Tickets]
      summary: Create a new ticket
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created (AI auto-categorization runs async)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: Get a ticket by ID
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          description: Not authorized to view this ticket
        '404':
          description: Ticket not found

    patch:
      tags: [Tickets]
      summary: Update ticket status, priority, or assignment (Agent/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/TicketStatus'
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                assignedToId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          description: Insufficient permissions

    delete:
      tags: [Tickets]
      summary: Delete a ticket (Admin/Owner only)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '204':
          description: Ticket deleted
        '403':
          description: Insufficient permissions

  # ---------- COMMENTS ----------
  /tickets/{ticketId}/comments:
    get:
      tags: [Comments]
      summary: List comments on a ticket
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

    post:
      tags: [Comments]
      summary: Add a comment to a ticket (broadcast via WebSocket to viewers)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                isInternalNote:
                  type: boolean
                  description: Visible only to agents/admins, hidden from customer
                  default: false
              required: [body]
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

  # ---------- AI ----------
  /ai/tickets/{ticketId}/suggest-reply:
    post:
      tags: [AI]
      summary: Generate a suggested reply for an agent based on ticket history
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: AI-generated reply suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion:
                    type: string
                  confidence:
                    type: number
                    format: float

  /ai/tickets/{ticketId}/summarize:
    post:
      tags: [AI]
      summary: Summarize a long ticket thread
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: AI-generated summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                  keyPoints:
                    type: array
                    items:
                      type: string

  /ai/tickets/{ticketId}/classify:
    post:
      tags: [AI]
      summary: Auto-classify ticket category, priority, and sentiment
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: Classification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: string
                  suggestedPriority:
                    $ref: '#/components/schemas/TicketPriority'
                  sentiment:
                    type: string
                    enum: [positive, neutral, negative, angry]
                  shouldEscalate:
                    type: boolean

  # ---------- ANALYTICS ----------
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Dashboard metrics (Admin/Owner only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Aggregated metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketsCreated:
                    type: integer
                  ticketsResolved:
                    type: integer
                  avgResolutionTimeHours:
                    type: number
                  avgFirstResponseTimeMinutes:
                    type: number
                  ticketsByStatus:
                    type: object
                    additionalProperties:
                      type: integer
                  ticketsByAgent:
                    type: array
                    items:
                      type: object
                      properties:
                        agentId:
                          type: string
                          format: uuid
                        agentName:
                          type: string
                        assignedCount:
                          type: integer
                        resolvedCount:
                          type: integer

  # ---------- NOTIFICATIONS ----------
  /notifications:
    get:
      tags: [Notifications]
      summary: >
        List notification log entries for the current user (audit trail
        of what was sent/suppressed/failed, not a preference center).
        There is no per-user opt-out in v1; this is read-only.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of notification log entries for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer

components:
  securitySchemes:
    entraBearerAuth:
      type: oauth2
      description: >
        Bearer token issued by Microsoft Entra ID External ID. The frontend
        acquires this via MSAL/NextAuth against the app's Entra ID tenant;
        the API validates it (signature, issuer, audience) using the
        tenant's OIDC discovery document rather than issuing or storing
        credentials itself.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes:
            openid: Sign in
            profile: Basic profile
            email: Email address
            offline_access: Refresh token

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketIdParam:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Role:
      type: string
      enum: [OWNER, ADMIN, AGENT, CUSTOMER]

    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, WAITING_ON_CUSTOMER, RESOLVED, CLOSED]

    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    Invite:
      type: object
      description: >
        A pending offer for someone to join an organization with a
        specific role. Consumed exactly once, at the point the invited
        email first authenticates via Entra ID and hits POST /auth/session.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    Notification:
      type: object
      description: >
        A log record of one notification delivery attempt. Exists mainly
        for audit and idempotency (avoid resending the same event on
        retry), not as a user-facing preference center in v1 — there is
        no NotificationPreference schema yet; sending uses fixed defaults
        per event type.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - TICKET_STATUS_CHANGED
            - TICKET_AGENT_REPLIED
            - TICKET_ASSIGNED
            - STAFF_INVITED
          description: >
            Deliberately narrow set for v1 — only events where the
            recipient likely wasn't watching live. Internal-note-created,
            branding-fetch-failure, and domain-hosting-status changes are
            surfaced in-app/dashboard only, not emailed, to avoid noise.
        channel:
          type: string
          enum: [EMAIL]
          description: Only channel implemented in v1; schema allows for future channels (SMS, push) without a breaking change
        relatedTicketId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [SENT, SUPPRESSED, FAILED]
          description: >
            SENT: delivered via Azure Communication Services Email.
            SUPPRESSED: not sent because the recipient was actively
            connected via WebSocket to the relevant room when the event
            fired (the real-time layer already notified them; emailing
            too would be redundant). FAILED: send attempt errored, safe
            to retry per normal Service Bus dead-letter handling.
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      description: >
        Application-level session info returned after syncing an Entra ID
        token. Does not include the Entra ID token itself — the frontend
        already holds that from MSAL/NextAuth and attaches it as the
        Bearer token on subsequent API calls.
      properties:
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'

    OrganizationBranding:
      type: object
      description: >
        Per-organization visual branding, auto-fetched from the org's
        verified domain via Brandfetch, with manual override support.
        This is enrichment data, not a blocking dependency for anything
        else in the app — a missing or failed fetch always falls back to
        default app branding.
      properties:
        organizationId:
          type: string
          format: uuid
        logoUrl:
          type: string
          nullable: true
          description: >
            URL to the logo as stored in our own Blob Storage, not a
            hotlinked third-party URL. Null if nothing has been fetched
            or uploaded yet.
        faviconUrl:
          type: string
          nullable: true
        primaryColor:
          type: string
          nullable: true
          example: "#1A73E8"
        accentColor:
          type: string
          nullable: true
        fontFamily:
          type: string
          nullable: true
          description: >
            Google Fonts family name applied as a design token
            (e.g. "Inter", "Poppins"). Not auto-fetched from Brandfetch
            in v1 — manual only, source will read CUSTOM whenever this
            is set.
        hideAttribution:
          type: boolean
          default: false
          description: >
            When true, hides "powered by [app]" attribution from this
            org's portal. Modeled as a plan-tier-gated feature in a real
            product; included here to reflect that design even without
            billing implemented.
        source:
          type: string
          enum: [AUTO_FETCHED, CUSTOM, DEFAULT]
          description: >
            AUTO_FETCHED = pulled from Brandfetch. CUSTOM = manually
            uploaded/set by an Owner or Admin, and excluded from future
            auto-refresh. DEFAULT = no branding resolved yet, app
            defaults are in use.
        brandingStatus:
          type: string
          enum: [PENDING, FETCHED, NOT_FOUND, FAILED]
          description: >
            PENDING: fetch job queued or in progress, not yet resolved.
            FETCHED: Brandfetch returned usable data, logoUrl/colors are
            populated. NOT_FOUND: Brandfetch returned a 404 for this
            domain — a real data gap, not an error; the Owner should be
            prompted to upload branding manually. FAILED: the fetch
            attempt errored (timeout, auth, rate limit, unexpected
            response) and may be safe to retry — distinct from
            NOT_FOUND, which will not resolve on retry without new data
            becoming available upstream.
        fetchedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    OrganizationDomain:
      type: object
      description: >
        A domain claimed by an organization. The same DNS-verification
        mechanism (TXT record) is reused for two distinct purposes,
        tracked and activated separately since they carry different
        trust implications: matching staff emails to this org is lower
        stakes than actually hosting the org's portal on this domain.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        domain:
          type: string
          example: acme.com
        verified:
          type: boolean
        verificationToken:
          type: string
          description: DNS TXT record value the Owner must publish to verify ownership
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        purposes:
          type: array
          description: >
            Which capabilities this verified domain is authorized for.
            AUTH_MATCHING is granted automatically on verification.
            CUSTOM_HOSTING must be separately requested via
            POST /organizations/domains/{domainId}/enable-hosting, since
            it means serving the org's portal on this domain rather than
            just matching staff emails.
          items:
            type: string
            enum: [AUTH_MATCHING, CUSTOM_HOSTING]
        hostingStatus:
          type: string
          enum: [NOT_REQUESTED, PENDING_CNAME, PENDING_CERT, ACTIVE, FAILED]
          description: >
            NOT_REQUESTED: hosting was never enabled for this domain.
            PENDING_CNAME: hosting requested, waiting for the org to
            point a CNAME at our ingress. PENDING_CERT: CNAME confirmed,
            TLS certificate provisioning in progress. ACTIVE: the org's
            portal is live on this custom domain. FAILED: CNAME
            validation or cert provisioning failed, safe to retry.
        hostingActivatedAt:
          type: string
          format: date-time
          nullable: true

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
          description: >
            The URL-safe subdomain used to reach this organization's
            portal (e.g. "acme" for acme.yourapp.com), used to resolve
            org context for both staff and customer sign-in.
        supportEmail:
          type: string
          description: >
            Used both for display and as the Reply-To on outbound
            notification emails, so replies reach the org even though
            the message is actually sent via our infrastructure
            (lightweight sender-identity white-labeling, short of full
            per-org email domain authentication).
        termsUrl:
          type: string
          nullable: true
        privacyUrl:
          type: string
          nullable: true
        supportFooterText:
          type: string
          nullable: true
          description: Free-text shown in the customer portal footer, e.g. a copyright line or contact note
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      description: >
        Application-level user record. Identity/authentication is owned by
        Entra ID — this table only stores the linkage (entraObjectId) plus
        org membership and role, which the app owns.
      properties:
        id:
          type: string
          format: uuid
        entraObjectId:
          type: string
          description: The 'oid' claim from the Entra ID token — stable identifier for this identity
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
          nullable: true
          description: >
            Null when status is PENDING_APPROVAL — the user has been
            matched to an org via verified email domain but not yet
            approved by an Admin/Owner, so they have no active permissions.
        status:
          type: string
          enum: [ACTIVE, PENDING_APPROVAL, DEACTIVATED]
          default: ACTIVE
          description: >
            ACTIVE: normal, has access per role. PENDING_APPROVAL:
            domain-matched, awaiting approval, role is null. DEACTIVATED:
            soft-removed via DELETE /users/{userId} — kept for
            referential integrity (ticket/comment history), no login
            access. There is no separate isActive flag; this single
            status field is authoritative.
        createdAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreateTicketRequest:
      type: object
      properties:
        subject:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriority'
      required: [subject, description]

    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        subject:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        category:
          type: string
          description: Set by AI classification, editable by agents
        sentiment:
          type: string
          enum: [positive, neutral, negative, angry]
        createdById:
          type: string
          format: uuid
        assignedToId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedTickets:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        isInternalNote:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string

security:
  - entraBearerAuth: []

# ---------------------------------------------------------------------
# Real-time events (WebSocket, Socket.io)
#
# OpenAPI doesn't natively model WebSocket contracts, so these are
# documented here rather than left implicit in endpoint descriptions
# (which is what happened before this section existed — several
# responses referenced "broadcast via WebSocket" with no event spec).
# Clients join a room per ticket: `ticket:{ticketId}`. Org-level events
# (branding refresh) broadcast to `org:{organizationId}`.
#
# ticket.comment.created   — payload: Comment
#   Emitted to ticket:{ticketId} whenever POST /tickets/{id}/comments
#   succeeds. isInternalNote comments are only emitted to sockets
#   authenticated as staff for that org, never to the customer's socket.
#
# ticket.updated           — payload: Ticket
#   Emitted to ticket:{ticketId} on any PATCH /tickets/{id} change
#   (status, priority, assignment).
#
# organization.branding.updated — payload: OrganizationBranding
#   Emitted to org:{organizationId} when a branding fetch/refresh job
#   completes (any brandingStatus transition), so an open settings page
#   updates live instead of requiring a manual poll.
#
# organization.domain.hosting_status_changed — payload: OrganizationDomain
#   Emitted to org:{organizationId} on hostingStatus transitions during
#   custom-domain setup (PENDING_CNAME → PENDING_CERT → ACTIVE/FAILED).
#
# Relationship to email notifications: the notification Function checks
# whether the target user has an active socket in the relevant room
# (ticket:{ticketId} or org:{organizationId}) at the moment the
# underlying event fires. If so, the email is SUPPRESSED (see
# Notification.status) rather than sent — the real-time event already
# reached them, so a duplicate email would be noise, not signal.
# ---------------------------------------------------------------------

