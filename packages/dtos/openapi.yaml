openapi: 3.0.3
info:
  title: AI Helpdesk Platform API
  description: >
    Multi-tenant internal IT/service-desk platform. Employees within an
    organization raise tickets against their own internal teams (e.g.
    Sales raising a ticket to IT), with role-based access control and
    AI-assisted ticket triage, reply suggestions, and summarization.
    B2B only — not a customer-facing support tool.

    Versioning: URL path versioning (/v1). Breaking changes ship as /v2
    with /v1 kept running until clients migrate — no header-based or
    content-negotiation versioning in this API.
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: https://api.yourapp.com/v1
    description: Production
  - url: http://localhost:4000/v1
    description: Local development

tags:
  - name: Auth
  - name: Organizations
  - name: Users
  - name: Tickets
  - name: Comments
  - name: AI
  - name: Analytics
  - name: Notifications
  - name: Platform

paths:
  # ---------- AUTH ----------
  # Authentication itself is delegated to Microsoft Entra ID External ID.
  # The frontend (MSAL / NextAuth with the Entra ID provider) handles the
  # actual sign-in redirect and receives an ID/access token directly from
  # Entra ID — this API never sees or stores a password. These endpoints
  # only cover what the API itself is responsible for: turning a validated
  # Entra ID token into an application user record with org/role context.
  # /auth/session org/role resolution order (see AuthResponse for shape):
  #   1. Pending Invite for this email? -> join that org, invited role,
  #      status ACTIVE. Checked first and unconditionally -- an invite is
  #      the strongest signal (a human already decided this person
  #      belongs here) and must not depend on subdomain or domain match
  #      both being present, since a newly invited person often signs in
  #      before their org's domain is verified.
  #   2. No invite, organizationSubdomain given? -> resolve org from
  #      subdomain, create as PENDING_APPROVAL for that org.
  #   3. No invite, no subdomain -> match email domain against verified
  #      OrganizationDomain records -> match found -> PENDING_APPROVAL.
  #      VENDOR is never reached via this step -- vendors have no
  #      relationship to the org's email domain, so they only ever join
  #      via step 1.
  #   4. No invite, no subdomain, no domain match -> bootstrap: create a
  #      new organization, this user becomes Owner, and attempt to
  #      register their email domain as that org's first (unverified)
  #      OrganizationDomain. OrganizationDomain.domain is globally
  #      unique (verified or not) -- if that registration hits a
  #      conflict (another org, verified or unverified, already holds
  #      this domain), this is a race: a second person from the same
  #      new company hit this step microseconds after the first. Do NOT
  #      create a duplicate org in that case -- roll back the new org,
  #      and instead join the user to the EXISTING org as
  #      PENDING_APPROVAL, same as a normal domain match. This is safe
  #      even though the existing domain claim may itself still be
  #      unverified, since PENDING_APPROVAL grants no access on its own.
  /auth/session:
    post:
      tags: [Auth]
      summary: Exchange a validated Entra ID token for an application session
      description: >
        Provisions or syncs the local User record for the authenticated
        Entra ID identity. See the org/role resolution order documented
        above this path.
      security:
        - entraBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationSubdomain:
                  type: string
                  description: >
                    Present when the frontend is on a company-specific
                    URL. Optional — omitting it falls back to domain
                    matching, useful for a generic login page.
      responses:
        '200':
          description: Existing user synced, application session returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '201':
          description: New user provisioned (ACTIVE via invite, PENDING_APPROVAL via domain match, or new-org Owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Entra ID token missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current application user (org, role) for the authenticated Entra ID identity
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
        '404':
          description: Entra ID identity has no application user yet — call /auth/session first

  # ---------- ORGANIZATIONS ----------
  /organizations/me:
    get:
      tags: [Organizations]
      summary: Get current user's organization
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

    patch:
      tags: [Organizations]
      summary: Update organization settings (Owner/Admin only)
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                supportEmail:
                  type: string
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Insufficient permissions

  /organizations/by-subdomain/{subdomain}:
    get:
      tags: [Organizations]
      summary: Public lookup of an organization by subdomain
      description: >
        Lets the login page confirm which org a company-specific URL
        resolves to before the sign-in redirect, and validates the
        subdomain that will be passed to /auth/session.
      parameters:
        - name: subdomain
          in: path
          required: true
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Organization found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  subdomain:
                    type: string
        '404':
          description: No organization with that subdomain

  /organizations/domains:
    get:
      tags: [Organizations]
      summary: List domains claimed by the current organization (Owner/Admin only)
      security:
        - entraBearerAuth: []
      responses:
        '200':
          description: List of claimed domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDomain'

    post:
      tags: [Organizations]
      summary: Claim a domain for domain-based auto-matching (Owner only)
      description: >
        Returns a DNS TXT record value that must be published before
        the domain is used in auth resolution.
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  example: acme.com
              required: [domain]
      responses:
        '201':
          description: Domain claimed, pending DNS verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '403':
          description: Insufficient permissions
        '409':
          description: Domain already claimed by another organization

  /organizations/domains/{domainId}/verify:
    post:
      tags: [Organizations]
      summary: Re-check the DNS TXT record and mark the domain verified if found (Owner only)
      description: >
        Once verified, the domain becomes usable in POST /auth/session's
        domain-matching step.
      security:
        - entraBearerAuth: []
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '403':
          description: Insufficient permissions
        '404':
          description: Domain not found

  /organizations/invites:
    get:
      tags: [Organizations]
      summary: List invites for the current organization (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
      responses:
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'

    post:
      tags: [Organizations]
      summary: Invite a teammate by email (Owner/Admin only)
      description: >
        Creates a pending invite record; the invited role is applied
        automatically when that email signs in via Entra ID and hits
        POST /auth/session for the first time.
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/Role'
              required: [email, role]
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '403':
          description: Insufficient permissions
        '409':
          description: A pending invite already exists for this email in this organization

  /organizations/invites/{inviteId}:
    delete:
      tags: [Organizations]
      summary: Revoke a pending invite (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invite revoked
        '403':
          description: Insufficient permissions
        '404':
          description: Invite not found
        '409':
          description: Invite already accepted, cannot revoke

  # ---------- TICKET TAXONOMY (Department / Category / Subcategory) ----------
  # Org-scoped, full CRUD, real Prisma-backed entities (not a generic
  # reference-data table — see Department schema description for why).
  /organizations/departments:
    get:
      tags: [Organizations]
      summary: List departments for the current organization
      security:
        - entraBearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'

    post:
      tags: [Organizations]
      summary: Create a department (Owner/Admin only)
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          description: Insufficient permissions
        '409':
          description: A department with this name already exists in this org

  /organizations/departments/{departmentId}:
    patch:
      tags: [Organizations]
      summary: Rename or (de)activate a department (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          description: Insufficient permissions

    delete:
      tags: [Organizations]
      summary: Soft-delete a department (Owner/Admin only)
      description: >
        Sets isActive to false rather than removing the row, since
        existing tickets may reference it. Fails if the department has
        active categories; deactivate those first.
      security:
        - entraBearerAuth: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          description: Insufficient permissions
        '409':
          description: Department has active categories

  /organizations/categories:
    get:
      tags: [Organizations]
      summary: List categories, optionally filtered by department
      security:
        - entraBearerAuth: []
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      tags: [Organizations]
      summary: Create a category under a department (Owner/Admin only)
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                departmentId:
                  type: string
                  format: uuid
                name:
                  type: string
              required: [departmentId, name]
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Insufficient permissions
        '404':
          description: Department not found

  /organizations/categories/{categoryId}:
    patch:
      tags: [Organizations]
      summary: Rename, reactivate, or deactivate a category (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Insufficient permissions

    delete:
      tags: [Organizations]
      summary: Soft-delete a category (Owner/Admin only). Fails if it has active subcategories.
      security:
        - entraBearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Insufficient permissions
        '409':
          description: Category has active subcategories

  /organizations/subcategories:
    get:
      tags: [Organizations]
      summary: List subcategories, optionally filtered by category
      security:
        - entraBearerAuth: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subcategory'

    post:
      tags: [Organizations]
      summary: Create a subcategory under a category (Owner/Admin only)
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryId:
                  type: string
                  format: uuid
                name:
                  type: string
              required: [categoryId, name]
      responses:
        '201':
          description: Subcategory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '403':
          description: Insufficient permissions
        '404':
          description: Category not found

  /organizations/subcategories/{subcategoryId}:
    patch:
      tags: [Organizations]
      summary: Rename, reactivate, or deactivate a subcategory (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: subcategoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Updated subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '403':
          description: Insufficient permissions

    delete:
      tags: [Organizations]
      summary: Soft-delete a subcategory (Owner/Admin only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: subcategoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subcategory deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '403':
          description: Insufficient permissions

  # ---------- USERS ----------
  /users:
    get:
      tags: [Users]
      summary: List users in the current organization (Admin/Owner only)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          description: Filter by user status
          schema:
            type: string
            enum: [ACTIVE, PENDING_APPROVAL, DEACTIVATED]
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a user by ID
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    patch:
      tags: [Users]
      summary: Update an ACTIVE user's role (Admin/Owner only)
      description: >
        Not valid for PENDING_APPROVAL users — use
        POST /users/{userId}/approve instead, which is a distinct
        action requiring its own permission check.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
              required: [role]
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
        '409':
          description: User is not ACTIVE (e.g. still PENDING_APPROVAL or DEACTIVATED)

    delete:
      tags: [Users]
      summary: Soft-remove a user from the organization (Owner only)
      description: >
        Sets status to DEACTIVATED rather than deleting the row — this
        preserves referential integrity for tickets/comments the user
        created or was assigned, and revokes their access without
        losing history.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions

  /users/{userId}/approve:
    post:
      tags: [Users]
      summary: Approve a PENDING_APPROVAL user and assign their role (Owner/Admin only)
      description: >
        Flips status to ACTIVE. This is the domain-matching counterpart
        to the invite flow, where role assignment happens immediately
        on sign-in instead.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
              required: [role]
      responses:
        '200':
          description: User approved and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
        '409':
          description: User is not in PENDING_APPROVAL status

  # ---------- TICKETS ----------
  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets, scoped by the authenticated user's org and role
      description: >
        Requesters see own tickets only, agents see assigned/team
        tickets, admins/owners see all tickets in their org.
        Organization is always derived from the validated Entra ID
        token's org context, never from a client-supplied parameter —
        there is no organizationId query param, by design, since
        accepting one would allow a request to specify an arbitrary org
        and break tenant isolation.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: assignedTo
          in: query
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TicketType'
      responses:
        '200':
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'

    post:
      tags: [Tickets]
      summary: Create a new ticket
      security:
        - entraBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created (AI classification runs async)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: Get a ticket by ID
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          description: Not authorized to view this ticket
        '404':
          description: Ticket not found

    patch:
      tags: [Tickets]
      summary: Update ticket status, priority, assignment, or classification (Agent/Admin only)
      description: >
        Setting type/departmentId/categoryId/subcategoryId here writes a
        new TicketClassification row with source: MANUAL — this is how
        a human override of AI classification gets recorded; without
        this endpoint, source: MANUAL would never occur in practice
        despite being a valid enum value. Setting assignedToId to null
        unassigns the ticket and writes a TicketAssignment row with
        assigneeUserId: null — see TicketAssignment for how
        unassignment is represented in the history table.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/TicketStatus'
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                assignedToId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Null explicitly unassigns the ticket. Must reference
                    a User with status: ACTIVE in this org — assigning
                    to a DEACTIVATED user is rejected (409), since a
                    deactivated user has no login access to act on it.
                type:
                  $ref: '#/components/schemas/TicketType'
                departmentId:
                  type: string
                  format: uuid
                categoryId:
                  type: string
                  format: uuid
                subcategoryId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          description: Insufficient permissions
        '409':
          description: assignedToId references a DEACTIVATED user

    delete:
      tags: [Tickets]
      summary: Delete a ticket (Admin/Owner only)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '204':
          description: Ticket deleted
        '403':
          description: Insufficient permissions

  # ---------- COMMENTS ----------
  /tickets/{ticketId}/comments:
    get:
      tags: [Comments]
      summary: List comments on a ticket
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

    post:
      tags: [Comments]
      summary: Add a comment to a ticket (broadcast via WebSocket to viewers)
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                isInternalNote:
                  type: boolean
                  description: Visible only to agents/admins, hidden from requester
                  default: false
              required: [body]
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

  # ---------- AI ----------
  /ai/tickets/{ticketId}/suggest-reply:
    post:
      tags: [AI]
      summary: Generate a suggested reply for an agent based on ticket history
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: AI-generated reply suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion:
                    type: string
                  confidence:
                    type: number
                    format: float

  /ai/tickets/{ticketId}/summarize:
    post:
      tags: [AI]
      summary: Summarize a long ticket thread
      description: >
        Persists a TicketSummary row (model used, generated text) in
        addition to returning the result directly — see
        GET /tickets/{ticketId}/summaries for history.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: AI-generated summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                  keyPoints:
                    type: array
                    items:
                      type: string

  /ai/tickets/{ticketId}/classify:
    post:
      tags: [AI]
      summary: Auto-classify a ticket's type, department, category, subcategory, priority, and sentiment
      description: >
        Persists a TicketClassification row with source: AI in addition
        to returning the result directly and updating Ticket's current
        fields. See GET /tickets/{ticketId}/classifications for history,
        including any later manual override (source: MANUAL).
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      responses:
        '200':
          description: Classification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    $ref: '#/components/schemas/TicketType'
                  departmentId:
                    type: string
                    format: uuid
                    nullable: true
                  categoryId:
                    type: string
                    format: uuid
                    nullable: true
                  subcategoryId:
                    type: string
                    format: uuid
                    nullable: true
                  priority:
                    $ref: '#/components/schemas/TicketPriority'
                  sentiment:
                    type: string
                    enum: [positive, neutral, negative, angry]
                  shouldEscalate:
                    type: boolean

  /tickets/{ticketId}/activity:
    get:
      tags: [Tickets]
      summary: Get the change history (status, priority, assignment) for a ticket (Agent/Admin/Owner only)
      description: >
        Staff-only, not exposed to the Requester who owns the ticket —
        this endpoint sits alongside /assignments, which can include
        internal-context notes not meant for the requester.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Ticket activity log, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketActivity'
        '403':
          description: Requester role cannot access ticket history endpoints

  /tickets/{ticketId}/assignments:
    get:
      tags: [Tickets]
      summary: Get the full assignment history for a ticket (Agent/Admin/Owner only)
      description: >
        Staff-only — TicketAssignment.note is free-text internal
        context (e.g. why a reassignment happened) not meant for the
        requester.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Assignment history, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketAssignment'
        '403':
          description: Requester role cannot access ticket history endpoints

  /tickets/{ticketId}/summaries:
    get:
      tags: [AI]
      summary: Get all AI-generated summaries for a ticket (most recent is "current")
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Summary history, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummary'

  /tickets/{ticketId}/classifications:
    get:
      tags: [AI]
      summary: >
        Get the classification history for a ticket, including both
        AI-generated and manually-overridden entries
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Classification history, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketClassification'

  # ---------- ANALYTICS ----------
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Dashboard metrics (Admin/Owner only)
      security:
        - entraBearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Aggregated metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketsCreated:
                    type: integer
                  ticketsResolved:
                    type: integer
                  avgResolutionTimeHours:
                    type: number
                  avgFirstResponseTimeMinutes:
                    type: number
                  ticketsByStatus:
                    type: object
                    additionalProperties:
                      type: integer
                  ticketsByDepartment:
                    type: array
                    items:
                      type: object
                      properties:
                        departmentId:
                          type: string
                          format: uuid
                        departmentName:
                          type: string
                        ticketCount:
                          type: integer
                        avgResolutionTimeHours:
                          type: number
                  ticketsByAgent:
                    type: array
                    items:
                      type: object
                      properties:
                        agentId:
                          type: string
                          format: uuid
                        agentName:
                          type: string
                        assignedCount:
                          type: integer
                        resolvedCount:
                          type: integer

  # ---------- NOTIFICATIONS ----------
  /notifications:
    get:
      tags: [Notifications]
      summary: List notification log entries for the current user
      description: >
        Audit trail of what was sent/suppressed/failed, not a
        preference center. There is no per-user opt-out in v1; this is
        read-only.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of notification log entries for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer

  # ---------- PLATFORM (operator-level super user, P2/stretch) ----------
  # Deliberately separate token/tenant scope from entraBearerAuth — see
  # platformBearerAuth. PlatformUser has no organizationId; access to a
  # specific org's data requires an explicit, time-boxed, audited
  # PlatformAccessSession rather than a standing cross-org permission.
  /platform/auth/session:
    post:
      tags: [Platform]
      summary: Exchange a validated platform Entra ID token for a PlatformUser session
      description: >
        Mirrors POST /auth/session's token-validation approach, but
        against the separate platform Entra ID app registration, and
        with no org-resolution branching at all — a PlatformUser simply
        does or doesn't already exist; there is no bootstrap/invite/
        domain-match logic here, since platform staff are provisioned
        out of band (e.g. by another platform admin), not self-service.
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Existing platform user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUser'
        '401':
          description: Platform token missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No PlatformUser exists for this identity — provisioning is out of band, not self-service

  /platform/organizations:
    get:
      tags: [Platform]
      summary: List all organizations on the platform (PlatformUser only)
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of all organizations, across every tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizations'

  /platform/access-sessions:
    post:
      tags: [Platform]
      summary: Open a time-boxed access session against one organization (PlatformUser only)
      description: >
        Required before any org-scoped platform read endpoint will
        return data — see PlatformAccessSession. A stated reason is
        mandatory, not optional, since this record is what makes
        platform access to a tenant's data inspectable after the fact.
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                  format: uuid
                reason:
                  type: string
              required: [organizationId, reason]
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccessSession'
        '403':
          description: Insufficient platform role
        '404':
          description: organizationId does not exist

  /platform/access-sessions/{sessionId}/end:
    post:
      tags: [Platform]
      summary: Close an active access session (PlatformUser only)
      security:
        - platformBearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session closed, endedAt set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccessSession'
        '403':
          description: Insufficient platform role
        '404':
          description: Session not found
        '409':
          description: Session already ended

  /platform/organizations/{organizationId}/tickets:
    get:
      tags: [Platform]
      summary: Read an organization's tickets during an active access session (PlatformUser only)
      description: >
        Requires an active (not yet ended) PlatformAccessSession for
        this organizationId — this is the pattern every other
        org-scoped platform read endpoint would follow; only tickets is
        shown here as the representative example rather than mirroring
        every tenant endpoint under /platform.
      security:
        - platformBearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of tickets for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '403':
          description: No active PlatformAccessSession for this organizationId
        '404':
          description: organizationId does not exist

  /organizations/platform-access-log:
    get:
      tags: [Organizations]
      summary: View the history of platform staff access to the current organization's data (Owner only)
      description: >
        Transparency measure — an org's own Owner can see every
        PlatformAccessSession opened against their org, including the
        stated reason, who opened it, and when it was closed.
      security:
        - entraBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of platform access sessions for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatformAccessSessions'

components:
  securitySchemes:
    entraBearerAuth:
      type: oauth2
      description: >
        Bearer token issued by Microsoft Entra ID External ID. The frontend
        acquires this via MSAL/NextAuth against the app's Entra ID tenant;
        the API validates it (signature, issuer, audience) using the
        tenant's OIDC discovery document rather than issuing or storing
        credentials itself.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes:
            openid: Sign in
            profile: Basic profile
            email: Email address
            offline_access: Refresh token

    platformBearerAuth:
      type: oauth2
      description: >
        Bearer token for PlatformUser (operator staff), issued via a
        separate Entra ID app registration from tenant-org auth —
        distinct token/tenant scope, since platform staff have no
        organizationId and aren't a role within any tenant.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{platformTenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{platformTenant}/oauth2/v2.0/token
          scopes:
            openid: Sign in

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketIdParam:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Role:
      type: string
      enum: [OWNER, ADMIN, AGENT, REQUESTER, VENDOR]

    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, WAITING_ON_REQUESTER, RESOLVED, CLOSED]

    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    TicketType:
      type: string
      enum: [INCIDENT, SERVICE_REQUEST, PROBLEM, CHANGE]
      description: >
        ITIL-aligned classification, orthogonal to Department/Category.
        INCIDENT: unplanned interruption, restore service.
        SERVICE_REQUEST: planned request for something new, fulfill an
        entitlement. PROBLEM: root cause of recurring incidents.
        CHANGE: a planned modification to a service. This distinction
        matters operationally (different SLA/workflow assumptions) even
        when two tickets share the same department/category.

    Invite:
      type: object
      description: >
        A pending offer for someone to join an organization with a
        specific role. Consumed exactly once, at the point the invited
        email first authenticates via Entra ID and hits POST /auth/session.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
        invitedByUserId:
          type: string
          format: uuid
          description: The Owner/Admin who created this invite, for audit purposes
        expiresAt:
          type: string
          format: date-time
          description: >
            When this invite transitions to EXPIRED if never accepted.
            A scheduled job (or a check at read/accept time) is
            responsible for the actual status transition.
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    Notification:
      type: object
      description: >
        A log record of one notification delivery attempt. Exists mainly
        for audit and idempotency (avoid resending the same event on
        retry), not as a user-facing preference center in v1 — there is
        no NotificationPreference schema yet; sending uses fixed defaults
        per event type.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - TICKET_STATUS_CHANGED
            - TICKET_AGENT_REPLIED
            - TICKET_ASSIGNED
            - STAFF_INVITED
          description: >
            Deliberately narrow set for v1 — only events where the
            recipient likely wasn't watching live. Internal-note-created
            is surfaced in-app/dashboard only, not emailed, to avoid noise.
        channel:
          type: string
          enum: [EMAIL]
          description: Only channel implemented in v1; schema allows for future channels (SMS, push) without a breaking change
        relatedTicketId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [SENT, SUPPRESSED, FAILED]
          description: >
            SENT: delivered via Azure Communication Services Email.
            SUPPRESSED: not sent because the recipient was actively
            connected via WebSocket to the relevant room when the event
            fired (the real-time layer already notified them; emailing
            too would be redundant). FAILED: send attempt errored, safe
            to retry per normal Service Bus dead-letter handling.
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      description: >
        Application-level session info returned after syncing an Entra ID
        token. Does not include the Entra ID token itself — the frontend
        already holds that from MSAL/NextAuth and attaches it as the
        Bearer token on subsequent API calls.
      properties:
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'

    OrganizationDomain:
      type: object
      description: >
        A domain claimed and DNS-verified by an organization, used to
        auto-match staff/requesters signing in from a generic
        (non-subdomain) login page. Verification proves domain
        ownership; it does not itself grant access — a domain-matched
        user still lands as PENDING_APPROVAL unless a matching Invite
        exists (see User.status).
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        domain:
          type: string
          example: acme.com
          description: >
            Globally unique across the platform (verified or not) — no
            two organizations can ever hold a claim on the same domain
            string, regardless of verification status. This is what
            makes the bootstrap race condition (two people from a new
            company signing up within moments of each other) safely
            detectable rather than silently creating duplicate orgs —
            see the /auth/session resolution-order comment.
        verified:
          type: boolean
        verificationToken:
          type: string
          description: DNS TXT record value the Owner must publish to verify ownership
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
          description: >
            The URL-safe subdomain used to reach this organization's
            instance (e.g. "acme" for acme.yourapp.com), used to resolve
            org context on sign-in.
        supportEmail:
          type: string
          description: >
            The org's internal IT/service-desk contact address. Used for
            display and as the Reply-To on outbound notification emails,
            so replies reach the org's own team even though the message
            is actually sent via our infrastructure.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      description: >
        Application-level user record. Identity/authentication is owned
        by an external identity provider (currently Microsoft Entra ID
        External ID) — this table only stores the linkage
        (identityProvider + externalId) plus org membership and role,
        which the app owns. Deliberately provider-agnostic: identityProvider
        and externalId together form the unique key, rather than a
        provider-named column, so adding or migrating to a different
        provider (Okta, Auth0, etc.) needs no schema change, only new
        rows with a different identityProvider value.
      properties:
        id:
          type: string
          format: uuid
        identityProvider:
          type: string
          enum: [ENTRA_ID]
          description: >
            Which identity provider authenticated this user. Only
            ENTRA_ID is in use today; the enum exists to be extended
            (OKTA, AUTH0, GOOGLE, ...) without touching any other field.
        externalId:
          type: string
          description: >
            The provider's stable identifier for this identity, opaque
            to the app and never parsed or assumed to have a particular
            format (Entra ID's 'oid' claim, for example). Combined with
            identityProvider as a compound unique key
            (identityProvider, externalId), since external IDs are only
            guaranteed unique within their own provider, not globally
            across providers.
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
          nullable: true
          description: >
            Null when status is PENDING_APPROVAL — the user has been
            matched to an org via verified email domain but not yet
            approved by an Admin/Owner, so they have no active permissions.
        status:
          type: string
          enum: [ACTIVE, PENDING_APPROVAL, DEACTIVATED]
          default: ACTIVE
          description: >
            ACTIVE: normal, has access per role. PENDING_APPROVAL:
            domain-matched, awaiting approval, role is null. DEACTIVATED:
            soft-removed via DELETE /users/{userId} — kept for
            referential integrity (ticket/comment history), no login
            access. There is no separate isActive flag; this single
            status field is authoritative.
        createdAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    PaginatedOrganizations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreateTicketRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriority'
        type:
          $ref: '#/components/schemas/TicketType'
        departmentId:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional — a requester may pick a department directly, or
            leave it unset and let AI classification (see
            POST /ai/tickets/{ticketId}/classify) suggest one. category/
            subcategory are not set at creation; they're assigned by AI
            classification or an agent afterward, since picking from a
            full category tree at submission time is poor UX for
            someone just trying to report a problem.
      required: [title, description]

    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        type:
          $ref: '#/components/schemas/TicketType'
        departmentId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: >
            Current classification, for fast reads. Full history of how
            this was set (AI vs. manual, and any re-classification) lives
            in TicketClassification — see GET /tickets/{ticketId}/classifications.
        subcategoryId:
          type: string
          format: uuid
          nullable: true
        sentiment:
          type: string
          enum: [positive, neutral, negative, angry]
        createdById:
          type: string
          format: uuid
        assignedToId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedTickets:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        body:
          type: string
        isInternalNote:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Department:
      type: object
      description: >
        An org-defined team that owns a slice of the ticket queue (e.g.
        "IT", "Facilities", "HR"). Deliberately org-scoped, real Prisma-
        backed entities rather than a global enum or a generic reference-
        data table — the set of departments is fixed in shape (a simple
        two-level Category/Subcategory tree beneath each) but each org
        defines its own set and names, since that genuinely varies
        company to company. Real foreign keys enforce the hierarchy at
        the database level; a generic polymorphic table was considered
        and rejected specifically because it can't express "a Category's
        parent must be a Department" as a real constraint.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          example: IT
        isActive:
          type: boolean
          default: true
          description: Soft-delete flag, same pattern as User.status — preserves ticket history referencing this department
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      description: A topic grouping beneath a Department (e.g. "Hardware" under IT).
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          type: string
          example: Hardware
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Subcategory:
      type: object
      description: >
        The most specific classification level, beneath a Category (e.g.
        "Laptop" under Hardware). This is the hard floor — no level
        beneath Subcategory, per standard service-desk taxonomy practice
        of capping category depth at two levels for usability.
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          example: Laptop
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketActivity:
      type: object
      description: >
        Audit log entry for a single field change on a ticket (status,
        priority, assignment, etc.) — powers a ticket history timeline
        in the UI. Every Ticket update that changes a tracked field
        writes one row here; this is append-only, never updated or
        deleted.
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            Null for system-driven changes (e.g. AI classification
            setting the initial category) rather than a human action.
        platformAccessSessionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Set when this change was made by a PlatformUser during an
            active PlatformAccessSession, rather than by a member of
            the org itself — keeps platform-originated actions visibly
            distinguishable in the audit trail rather than
            indistinguishable from an org member's own action.
        type:
          type: string
          enum: [STATUS_CHANGED, PRIORITY_CHANGED, ASSIGNED, TYPE_CHANGED, DEPARTMENT_CHANGED, CATEGORY_CHANGED]
        fromValue:
          type: string
          nullable: true
        toValue:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Free-form extra context specific to the activity type (e.g. a reassignment note)
        createdAt:
          type: string
          format: date-time

    TicketAssignment:
      type: object
      description: >
        History of ticket assignments. Ticket.assignedToId always holds
        the current assignee for fast reads; this table is the full
        audit trail (who assigned it, who to, when, and why) — the same
        current-value-plus-history split used for
        TicketClassification (Ticket.categoryId holds the current value,
        TicketClassification holds the full history of how it got there).
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            Null represents an unassignment event — PATCH
            /tickets/{ticketId} with assignedToId: null writes a row
            here with assigneeUserId: null, so "this ticket was
            unassigned, by whom, when" is captured in history the same
            way an assignment is, rather than being an unrepresentable
            state.
        assignedByUserId:
          type: string
          format: uuid
          nullable: true
          description: Null if the assignment was automated rather than performed by a person
        assignedAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true

    TicketSummary:
      type: object
      description: >
        Persisted output of POST /ai/tickets/{ticketId}/summarize.
        Previously this endpoint returned a summary with no stored
        record at all — this closes that gap. Multiple rows per ticket
        are allowed (re-summarized as a thread grows); the frontend
        reads the most recent by createdAt as "current."
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        summary:
          type: string
        keyPoints:
          type: array
          items:
            type: string
          description: Persisted alongside summary — previously only returned in the ephemeral API response, never stored.
        model:
          type: string
          description: Which AI model generated this summary, e.g. "gpt-4o", for traceability
        createdAt:
          type: string
          format: date-time

    TicketClassification:
      type: object
      description: >
        Persisted output of POST /ai/tickets/{ticketId}/classify.
        Ticket.type/departmentId/categoryId/subcategoryId/priority/
        sentiment hold the current values for fast reads; this table is
        the history of how those values were set, including whether AI
        proposed them or a human overrode them, mirroring the
        current-value-plus-history pattern used elsewhere in this schema.
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TicketType'
        departmentId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        subcategoryId:
          type: string
          format: uuid
          nullable: true
        priority:
          $ref: '#/components/schemas/TicketPriority'
        sentiment:
          type: string
          enum: [positive, neutral, negative, angry]
        source:
          type: string
          enum: [AI, MANUAL]
          description: Whether this classification came from the AI job or a human edit/override
        shouldEscalate:
          type: boolean
          default: false
          description: Persisted alongside the rest of the classification — previously only returned in the ephemeral classify response, never stored.
        createdAt:
          type: string
          format: date-time

    PlatformUser:
      type: object
      description: >
        The operator's own internal staff (not a role within any tenant
        Organization). Deliberately a separate entity from User rather
        than a SUPER_ADMIN value in Role — every existing role is scoped
        to exactly one organizationId, and every RBAC/query check in
        this API relies on that being true. Giving a role cross-org
        reach by special-casing it inside the same table would mean
        scattering "unless this role, skip the org filter" checks across
        every endpoint, undermining the structural tenant-isolation
        guarantee (org context is always server-derived, never
        bypassable) the rest of this API is built on.
      properties:
        id:
          type: string
          format: uuid
        identityProvider:
          type: string
          enum: [ENTRA_ID]
        externalId:
          type: string
          description: Resolved against a separate, locked-down Entra ID app registration — see platformBearerAuth.
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [PLATFORM_SUPPORT, PLATFORM_ADMIN]
        createdAt:
          type: string
          format: date-time

    PlatformAccessSession:
      type: object
      description: >
        An explicit, time-boxed, audited grant of a PlatformUser's
        access to one Organization's data. Elevated access is never
        standing/implicit — a platform user must open a session with a
        stated reason before touching any tenant's data, and the
        session is visible to that org's own Owner as a transparency
        measure (see GET /organizations/platform-access-log). This
        mirrors the least-privilege reasoning already used for
        PENDING_APPROVAL: don't grant more access than can currently be
        justified, and make the grant itself inspectable after the fact.
      properties:
        id:
          type: string
          format: uuid
        platformUserId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        reason:
          type: string
          example: Investigating support ticket #4821
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the session is still active. A session should also auto-expire server-side after a bounded duration even if never explicitly ended.

    PaginatedPlatformAccessSessions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAccessSession'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string

security:
  - entraBearerAuth: []

# ---------------------------------------------------------------------
# Real-time events (WebSocket, Socket.io)
#
# OpenAPI doesn't natively model WebSocket contracts, so these are
# documented here rather than left implicit in endpoint descriptions
# (which is what happened before this section existed — several
# responses referenced "broadcast via WebSocket" with no event spec).
#
# Room design: split public/internal, not a single room with
# procedural filtering. Two independent audit passes flagged the
# earlier single-room-plus-filtered-emit approach as a real risk — a
# single stray `io.to('ticket:{id}').emit(...)` call anywhere in the
# codebase (bypassing the intended per-socket filter) would leak
# internal notes to a requester, and nothing structural would catch
# it. Splitting into two rooms enforces the boundary at the pub/sub
# subscription layer instead of relying on every emit call site
# remembering to filter correctly:
#   - ticket:{ticketId}:public   — joined by Requester, Agent, Admin, Owner
#   - ticket:{ticketId}:internal — joined ONLY by Agent, Admin, Owner
# Room membership is set once at socket connection/join time based on
# the authenticated user's role for that ticket's org, not
# re-evaluated per event.
#
# ticket.comment.created   — payload: Comment
#   isInternalNote: false comments emitted to :public (reaches
#   everyone). isInternalNote: true comments emitted to :internal only
#   — a requester's socket was never subscribed to that room, so there
#   is no code path by which they can receive it, not just a
#   convention that every emit call has to remember to honor.
#
# ticket.updated           — payload: Ticket
#   Emitted to :public (visible to everyone with ticket access) on any
#   PATCH /tickets/{id} change (status, priority, assignment, or
#   unassignment — assignedToId: null included).
#
# Relationship to email notifications: the notification Function checks
# whether the target user has an active socket in the relevant room
# (ticket:{ticketId}:public, ticket:{ticketId}:internal, or
# org:{organizationId}) at the moment the underlying event fires. If
# so, the email is SUPPRESSED (see Notification.status) rather than
# sent — the real-time event already reached them, so a duplicate
# email would be noise, not signal.
#
# Known accepted trade-off: this check is not atomic with the client's
# actual connection state. A socket that drops for a few seconds right
# as an event fires will read as "not connected," so an email sends;
# if the client reconnects moments later, the user gets both an in-app
# update and an email. This is treated as acceptable mild redundancy
# rather than solved with heartbeat-based connection-confidence
# windows, which would add real complexity for a rare, low-severity
# case (occasional double notification, not silence or data loss).
# ---------------------------------------------------------------------


